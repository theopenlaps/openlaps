<style>
/* Concepto: tablero de manejo sobre la escena 3D a pantalla completa; el amarillo de raya central es el único acento. */
:root {
  --asfalto: #15171a;
  --asfalto-2: #1f2226;
  --linea: #3a3f46;
  --texto: #eceae4;
  --texto-2: #a9adb3;
  --amarillo: #e8b21e;
  --rojo: #d9483b;
  --verde: #4caf6a;
  --vidrio: rgba(21, 23, 26, 0.78);
  --f-display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-texto: "Saira Semi Condensed", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
/* los bloques con display propio (grid, flex) ignoraban el atributo hidden: el aviso de
   "Cargando la pista…" se quedaba encima de la escena ya cargada */
[hidden] { display: none !important; }
body { background: var(--asfalto); color: var(--texto); font: 15px/1.45 var(--f-texto); overflow: hidden; }
#lienzo { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.barra {
  position: fixed; top: 0; left: 0; right: 0; z-index: 5;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding-top: calc(10px + env(safe-area-inset-top, 0px)); padding-bottom: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(var(--vidrio), transparent);
  pointer-events: none;
}
.barra > * { pointer-events: auto; }
.marca { font: 700 20px/1 var(--f-display); letter-spacing: 0.04em; text-transform: uppercase; margin-right: auto; display: flex; align-items: center; gap: 8px; min-width: 0; }
.marca i { width: 26px; height: 4px; background: var(--amarillo); display: inline-block; box-shadow: 0 8px 0 var(--texto-2); transform: translateY(-4px); }
.marca span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
button, .boton {
  font: 600 14px/1 var(--f-display); letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--texto); background: var(--asfalto-2); border: 1px solid var(--linea); border-radius: 6px;
  padding: 9px 12px; cursor: pointer; min-height: 38px; display: inline-flex; align-items: center; gap: 6px;
}
button:hover, .boton:hover { border-color: var(--texto-2); }
button:focus-visible, .boton:focus-within { outline: 2px solid var(--amarillo); outline-offset: 2px; }
button[aria-pressed="true"] { background: var(--amarillo); color: var(--asfalto); border-color: var(--amarillo); }
.boton input { position: absolute; width: 1px; height: 1px; opacity: 0; }

.hud {
  position: fixed; z-index: 5; left: max(16px, env(safe-area-inset-left, 0px));
  top: calc(70px + env(safe-area-inset-top, 0px));
  display: grid; gap: 4px; padding: 10px 14px; background: var(--vidrio); border-left: 3px solid var(--amarillo);
  font-family: var(--f-display); font-variant-numeric: tabular-nums; min-width: 150px;
}
.hud .vel { font-size: 44px; font-weight: 700; line-height: 1; }
.hud .vel small { font-size: 16px; color: var(--texto-2); margin-left: 4px; font-weight: 500; }
.hud .fila { display: flex; justify-content: space-between; gap: 14px; font-size: 15px; color: var(--texto-2); letter-spacing: 0.04em; text-transform: uppercase; }
.hud .fila b { color: var(--texto); font-weight: 600; }
.hud .crono { font-size: 26px; font-weight: 700; color: var(--amarillo); }
.hud .crono.fin { color: var(--verde); }

.info {
  position: fixed; z-index: 5; right: max(16px, env(safe-area-inset-right, 0px));
  top: calc(70px + env(safe-area-inset-top, 0px));
  font: 500 13px/1.5 var(--f-display); letter-spacing: 0.05em; text-transform: uppercase; color: var(--texto-2);
  text-align: right; background: var(--vidrio); padding: 8px 12px; font-variant-numeric: tabular-nums;
}

.mandos {
  position: fixed; z-index: 6; left: 0; right: 0; bottom: 0;
  display: flex; justify-content: space-between; align-items: flex-end; gap: 12px;
  padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none; user-select: none; -webkit-user-select: none;
}
.mandos .grupo { display: flex; gap: 12px; pointer-events: auto; }
.tecla {
  width: 76px; height: 76px; border-radius: 50%; border: 2px solid var(--linea); background: var(--vidrio);
  display: grid; place-items: center; color: var(--texto); touch-action: none;
  font: 700 15px/1 var(--f-display); letter-spacing: 0.06em;
}
.tecla.on { border-color: var(--amarillo); color: var(--amarillo); }
.tecla svg { width: 30px; height: 30px; stroke: currentColor; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.tecla.acel { width: 84px; height: 108px; border-radius: 14px; }
.tecla.freno { width: 76px; height: 76px; border-radius: 14px; }

.vacio {
  position: fixed; inset: 0; z-index: 4; display: grid; place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.vacio .caja { max-width: 440px; display: grid; gap: 14px; }
.vacio h1 { font: 700 34px/1.05 var(--f-display); text-transform: uppercase; letter-spacing: 0.02em; margin: 0; text-wrap: balance; }
.vacio p { margin: 0; color: var(--texto-2); }
.vacio code { font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 13px; color: var(--texto); background: var(--asfalto-2); padding: 2px 6px; border-radius: 4px; word-break: break-all; }
.progreso { height: 4px; background: var(--asfalto-2); overflow: hidden; }
.progreso div { height: 100%; width: 0; background: var(--amarillo); transition: width .2s; }
.aviso { color: var(--rojo); }

@media (max-width: 560px) {
  .hud { top: auto; bottom: calc(140px + env(safe-area-inset-bottom, 0px)); min-width: 120px; }
  .hud .vel { font-size: 36px; }
  .info { display: none; }
  .tecla { width: 66px; height: 66px; }
  .tecla.acel { width: 74px; height: 96px; }
  .tecla.freno { width: 66px; height: 66px; }
}
@media (hover: hover) and (pointer: fine) { .mandos { display: none; } }
.tip {
  position: fixed; z-index: 30; pointer-events: none; max-width: 260px; padding: 6px 10px; border-radius: 8px;
  background: rgba(18, 20, 24, 0.94); backdrop-filter: blur(12px); border: 1px solid #4b525b;
  color: var(--texto); font: 400 12px/1.35 var(--f-texto);
  box-shadow: 0 10px 26px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 255, 255, .07);
  display: inline-flex; align-items: center; gap: 7px; flex-wrap: wrap;
  opacity: 0; transform: translateY(3px) scale(.97); transition: opacity .14s ease, transform .2s ease-out;
}
.tip.arriba { transform: translateY(-3px) scale(.97); }
.tip.visible { opacity: 1; transform: translateY(0) scale(1); }
.tip kbd {
  font: 600 11px/1 var(--f-display); letter-spacing: .04em; text-transform: uppercase;
  padding: 2px 6px; border-radius: 4px; background: #292d32; border: 1px solid #4b525b; color: var(--amarillo);
}
@media (prefers-reduced-motion: reduce) { .progreso div, .tip { transition: none; } }
/* ?incrustado=1: dentro de la vista previa de la app de escritorio, sin lo que no cabe */
.incrustado .barra, .incrustado .info, .incrustado .hud, .incrustado .mandos { display: none !important; }
.incrustado .barra { padding: 6px; gap: 6px; }
.incrustado .marca { display: none; }
</style>

  </div>
</div>

<script type="module">
if (new URLSearchParams(location.search).has("incrustado")) document.documentElement.classList.add("incrustado");
// ---------------------------------------------------------------- idioma (?lang=es|en; si no, el del navegador)
const LANG = (new URLSearchParams(location.search).get("lang") || navigator.language || "es").toLowerCase().startsWith("es") ? "es" : "en";
const TX = {
  es: {
    escena: "Escena 3D de la pista", conducir: "Recorrer", libre: "Vista libre", modo_t: "Cambiar entre cámara por calle y vista libre (tecla V)",
    camara: "Altura", camara_t: "Cambiar altura de cámara (tecla C)", salida: "Salida", salida_t: "Volver a la salida (tecla R)",
    alta: "Alta", alta_t: "Sombras y más resolución (gasta más batería)", abrir: "Abrir .glb", abrir_t: "Abrir un archivo .glb generado con OpenLaps",
    dist: "Dist.", superficie: "Superficie", izq: "Izquierda", der: "Derecha", freno: "FRENO", acel: "ACEL",
    cargando: "Cargando la pista…", archivo: "Archivo: ",
    intro: "Las calles, el relieve y los edificios salen de datos abiertos (OpenStreetMap, Copernicus, ESA WorldCover y más) y un algoritmo los convierte en una pista.",
    no_abre: "No se pudo abrir la pista", ayuda_abrir: "Abre un archivo .glb generado con OpenLaps usando el botón “Abrir .glb”.",

    triangulos: "triángulos", cruza: "Cruza la salida",
    vivo_titulo: "Tramo en vivo", vivo_gen: "Generando los primeros pedazos alrededor de la salida (la primera vez tarda un poco: hay que bajar los datos)…",
    vivo_espera: "esperando terreno", vivo_en_vivo: "en vivo", vivo_pedazos: "pedazos", vivo_generando: "generando", vivo_sin: "Sin servidor del tramo en vivo", vivo_zona: "zona lista",
    sup: { ROAD: "Asfalto", MXCOBBLE: "Empedrado", LOOSE: "Terracería", MXGRAVA: "Grava", MXTIERRA: "Tierra", MXARENA: "Arena", MXPASTO: "Pasto", MXVADO: "Vado", MXDIRT: "Tierra", PAVEMENT: "Acera", GRASS: "Hierba", DIRT: "Tierra suelta", SAND: "Arena", MXROCA: "Roca", WATER: "Agua" },
  },
  en: {
    escena: "3D track scene", conducir: "Explore", libre: "Free view", modo_t: "Switch between road camera and free view (V key)",
    camara: "Height", camara_t: "Switch camera height (C key)", salida: "Start", salida_t: "Back to the start (R key)",
    alta: "High", alta_t: "Shadows and higher resolution (uses more battery)", abrir: "Open .glb", abrir_t: "Open a .glb file generated with OpenLaps",
    dist: "Dist.", superficie: "Surface", izq: "Left", der: "Right", freno: "BRAKE", acel: "GAS",
    cargando: "Loading the track…", archivo: "File: ",
    intro: "Streets, terrain and buildings come from open data (OpenStreetMap, Copernicus, ESA WorldCover and more) and an algorithm turns them into a track.",
    no_abre: "Couldn't open the track", ayuda_abrir: "Open a .glb file generated with OpenLaps using the “Open .glb” button.",
    abre_una: "Open a generated track", genera: "Generate a track with OpenLaps and open it with the “Open .glb” button.",
    triangulos: "triangles", cruza: "Cross the start line",
    vivo_titulo: "Live stage", vivo_gen: "Generating the first pieces around the start (the first time takes a while: the data has to be downloaded)…",
    vivo_espera: "waiting for terrain", vivo_en_vivo: "live", vivo_pedazos: "pieces", vivo_generando: "generating", vivo_sin: "No live stage server", vivo_zona: "area ready",
    sup: { ROAD: "Asphalt", MXCOBBLE: "Cobblestone", LOOSE: "Unpaved", MXGRAVA: "Gravel", MXTIERRA: "Dirt", MXARENA: "Sand", MXPASTO: "Grass", MXVADO: "Ford", MXDIRT: "Dirt", PAVEMENT: "Sidewalk", GRASS: "Grass", DIRT: "Loose dirt", SAND: "Sand", MXROCA: "Rock", WATER: "Water" },
  },
}[LANG];
document.documentElement.lang = LANG;
for (const el of document.querySelectorAll("[data-tx]")) el.firstChild.nodeValue = TX[el.dataset.tx];
for (const el of document.querySelectorAll("[data-tx-t]")) { el.dataset.tip = TX[el.dataset.txT]; el.removeAttribute("title"); }
for (const el of document.querySelectorAll("[data-tx-a]")) el.setAttribute("aria-label", TX[el.dataset.txA]);
(() => {
  const tip = document.createElement("div");
  tip.className = "tip";
  tip.setAttribute("role", "tooltip");
  tip.hidden = true;
  document.body.append(tip);
  let actual = null, timer = null, ultimoOculto = 0;
  const buscar = (n) => n?.closest?.("[data-tip],[title]") || null;
  const pintar = (el) => {
    if (el.hasAttribute("title")) { el.dataset.tip = el.getAttribute("title") || ""; el.removeAttribute("title"); }
    const raw = el.dataset.tip;
    if (!raw) return ocultar();
    const m = raw.match(/^(.*?)\s*\(((?:tecla\s+)?[A-Za-z0-9+]+(?:\s+key)?)\)\s*$/i);
    tip.textContent = "";
    if (m && m[1]) {
      tip.append(document.createTextNode(m[1]));
      const k = document.createElement("kbd");
      k.textContent = m[2].replace(/^tecla\s+/i, "").replace(/\s+key$/i, "").toUpperCase();
      tip.append(k);
    } else tip.textContent = raw;
    tip.hidden = false;
    tip.classList.remove("visible", "arriba");
    const r = el.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
    const abajo = r.bottom + 8 + th <= innerHeight - 8 || r.top - 8 - th < 8;
    tip.classList.toggle("arriba", !abajo);
    tip.style.left = `${Math.round(Math.max(8, Math.min(r.left + r.width / 2 - tw / 2, innerWidth - tw - 8)))}px`;
    tip.style.top = `${Math.round(abajo ? r.bottom + 8 : Math.max(8, r.top - th - 8))}px`;
    requestAnimationFrame(() => tip.classList.add("visible"));
  };
  const ocultar = () => {
    clearTimeout(timer);
    if (actual) ultimoOculto = Date.now();
    actual = null;
    tip.classList.remove("visible");
    tip.hidden = true;
  };
  document.addEventListener("pointerover", (e) => {
    const el = buscar(e.target);
    if (!el || el === actual) { if (!el) ocultar(); return; }
    clearTimeout(timer);
    actual = el;
    timer = setTimeout(() => { if (actual === el) pintar(el); }, Date.now() - ultimoOculto < 420 ? 80 : 320);
  });
  document.addEventListener("pointerout", (e) => { if (actual && !actual.contains(e.relatedTarget)) ocultar(); });
  document.addEventListener("focusin", (e) => { const el = buscar(e.target); if (el && el.matches(":focus-visible")) { actual = el; clearTimeout(timer); pintar(el); } });
  document.addEventListener("focusout", ocultar);
  document.addEventListener("pointerdown", ocultar);
})();
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { computeBoundsTree, acceleratedRaycast } from "three-mesh-bvh";

THREE.BufferGeometry.prototype.computeBoundsTree = computeBoundsTree;
THREE.Mesh.prototype.raycast = acceleratedRaycast;

const $ = (id) => document.getElementById(id);
const SUPERFICIES = TX.sup;
const VMAX = { ROAD: 50, MXCOBBLE: 30, LOOSE: 33, MXGRAVA: 31, MXTIERRA: 30, MXARENA: 22, MXPASTO: 22, MXVADO: 12, MXDIRT: 33, PAVEMENT: 25, GRASS: 16, DIRT: 18, SAND: 12, MXROCA: 14, WATER: 5 };   // m/s según superficie
const AGARRE = { ROAD: 1.0, MXCOBBLE: 0.85, LOOSE: 0.72, MXGRAVA: 0.68, MXTIERRA: 0.66, MXARENA: 0.55, MXPASTO: 0.55, MXVADO: 0.45, MXDIRT: 0.7, PAVEMENT: 0.9, GRASS: 0.5, DIRT: 0.55, SAND: 0.45, MXROCA: 0.7, WATER: 0.25 };

const canvas = $("lienzo");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
let alta = false;
function ajustarCalidad() {
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, alta ? 2 : 1.25));
  renderer.shadowMap.enabled = alta;
  sol.castShadow = alta;
  scene.traverse((o) => { if (o.material) o.material.needsUpdate = true; });
}

const scene = new THREE.Scene();
const CIELO = new THREE.Color(0x9cc3e6);
scene.background = CIELO;
scene.fog = new THREE.Fog(CIELO, 250, 1800);
const camera = new THREE.PerspectiveCamera(62, 1, 0.2, 6000);
scene.add(new THREE.HemisphereLight(0xdfeeff, 0x6b5a44, 1.35));
const sol = new THREE.DirectionalLight(0xfff1dc, 2.4);
sol.position.set(300, 500, 200);
sol.shadow.mapSize.set(2048, 2048);
sol.shadow.camera.left = sol.shadow.camera.bottom = -90;
sol.shadow.camera.right = sol.shadow.camera.top = 90;
sol.shadow.camera.far = 1500;
scene.add(sol, sol.target);

const orbit = new OrbitControls(camera, canvas);
orbit.enableDamping = true;
orbit.maxPolarAngle = Math.PI * 0.49;
orbit.enabled = false;

function redimensionar() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", redimensionar);

// ---------------------------------------------------------------- estado
const st = {
  pos: new THREE.Vector3(), yaw: 0, v: 0, up: new THREE.Vector3(0, 1, 0),
  superficie: "ROAD", camara: "baja", manejar: true,
  spawn: null, ruta: null, rutaS: null, iRuta: 0, iIni: 0, iFin: 0,
  crono: { estado: "listo", t0: 0, t: 0 },
};
let suelo = [], muros = [], mundo = null;
const keys = {};
const ray = new THREE.Raycaster();
ray.firstHitOnly = true;
const ABAJO = new THREE.Vector3(0, -1, 0);

// `sobre`: desde cuánto más arriba se busca el suelo. Para el coche, poco (3 m): con 40 m, al pasar bajo un puente
// el rayo encontraba primero el tablero y subía el coche encima, contra el pretil.
function alturaEn(x, z, y0, sobre = 40) {
  ray.set(new THREE.Vector3(x, y0 + sobre, z), ABAJO);
  ray.far = 200;
  const h = ray.intersectObjects(suelo, false)[0];
  return h || null;
}

function colocarEnSalida() {
  if (!st.spawn) return;
  st.pos.copy(st.spawn.pos);
  st.yaw = Math.atan2(st.spawn.fwd.x, st.spawn.fwd.z);
  st.v = 0;
  const h = alturaEn(st.pos.x, st.pos.z, st.pos.y);
  if (h) st.pos.y = h.point.y;
  st.crono = { estado: "listo", t0: 0, t: 0 };
  if (st.ruta) st.iRuta = indiceCercano(st.pos, 0, st.ruta.length);
  $("crono").hidden = !st.ruta;
  $("crono").classList.remove("fin");
}

function indiceCercano(p, a, b) {
  let best = a, bd = Infinity;
  const R = st.ruta;
  for (let i = Math.max(0, a); i < Math.min(R.length, b); i++) {
    const dx = R[i][0] - p.x, dz = R[i][2] - p.z;
    const d = dx * dx + dz * dz;
    if (d < bd) { bd = d; best = i; }
  }
  return best;
}

function cadenamiento(m) {
  const km = Math.floor(m / 1000), r = Math.floor(m % 1000);
  return `${km}+${String(r).padStart(3, "0")}`;
}

function fmtTiempo(s) {
  const m = Math.floor(s / 60);
  return `${m}:${(s - m * 60).toFixed(1).padStart(4, "0")}`;
}

// ---------------------------------------------------------------- carga
const loader = new GLTFLoader();
function cargar(url, nombre) {
  $("vacio").hidden = false;
  $("v-titulo").textContent = TX.cargando;
  $("v-texto").textContent = nombre ? `${TX.archivo}${nombre}` : $("v-texto").textContent;
  loader.load(url, (gltf) => {
    try { montar(gltf); } catch (e) { fallo(e); }
  }, (ev) => {
    if (ev.total) $("barra").style.width = `${Math.round((ev.loaded / ev.total) * 100)}%`;
  }, fallo);
}
function fallo(err) {
  $("vacio").hidden = false;
  $("v-titulo").textContent = TX.no_abre;
  $("v-texto").innerHTML = `<span class="aviso">${(err && err.message) || err}</span><br>${TX.ayuda_abrir}`;
}

function montar(gltf) {
  if (mundo) { scene.remove(mundo); mundo.traverse((o) => { o.geometry?.dispose?.(); }); }
  mundo = gltf.scene;
  scene.add(mundo);
  suelo = []; muros = [];
  let tris = 0;
  mundo.traverse((o) => {
    if (!o.isMesh) return;
    const n = o.name;
    tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3;
    o.receiveShadow = true;
    o.castShadow = /edificios|vegetacion|defensa|puente/.test(n);
    const m = o.material;
    if (m.map) { m.map.anisotropy = renderer.capabilities.getMaxAnisotropy(); }
    if (/^\d(?!WALL)[A-Z]+_/.test(n)) { o.geometry.computeBoundsTree(); suelo.push(o); }
    else if (/^\dWALL/.test(n)) { o.geometry.computeBoundsTree(); muros.push(o); }
  });
  const ex = gltf.parser.json.extras || {};
  $("nombre").textContent = ex.nombre || "openlaps";
  // salida
  let nodo = null;
  for (const k of ["AC_HOTLAP_START_0", "AC_START_0", "AC_PIT_0"]) { nodo = nodo || mundo.getObjectByName(k); }
  const caja = new THREE.Box3().setFromObject(mundo);
  const centro = caja.getCenter(new THREE.Vector3());
  if (nodo) {
    const f = nodo.userData.forward || [0, 0, -1];
    st.spawn = { pos: nodo.position.clone(), fwd: new THREE.Vector3(f[0], 0, f[2]).normalize() };
  } else {
    st.spawn = { pos: centro.clone(), fwd: new THREE.Vector3(0, 0, -1) };
  }
  st.ruta = ex.ruta || null;
  if (st.ruta) {
    st.rutaS = [0];
    for (let i = 1; i < st.ruta.length; i++) {
      const a = st.ruta[i - 1], b = st.ruta[i];
      st.rutaS.push(st.rutaS[i - 1] + Math.hypot(b[0] - a[0], b[2] - a[2]));
    }
    const L = st.rutaS[st.rutaS.length - 1];
    const cerrado = ex.modo === "circuito";
    const sIni = Math.min(60, L * 0.1), sFin = cerrado ? L : Math.max(L - 30, L * 0.9);
    st.iIni = st.rutaS.findIndex((s) => s >= sIni);
    st.iFin = st.rutaS.findIndex((s) => s >= sFin - (cerrado ? 1 : 0));
    if (st.iFin < 0) st.iFin = st.ruta.length - 1;
  }
  const tam = caja.getSize(new THREE.Vector3());
  scene.fog.far = Math.max(1200, Math.max(tam.x, tam.z) * 1.2);
  orbit.target.copy(centro);
  camera.position.copy(centro).add(new THREE.Vector3(-tam.x * 0.45, Math.max(tam.x, tam.z) * 0.45, tam.z * 0.45));
  $("info").textContent = `${(tam.x / 1000).toFixed(2)} × ${(tam.z / 1000).toFixed(2)} km · ${Math.round(tris).toLocaleString(LANG)} ${TX.triangulos}`;
  $("info").hidden = false;
  $("vacio").hidden = true;
  colocarEnSalida();
  modo(true);
  // ?cam=x,y,z&mira=x,y,z (coordenadas del .glb): abre en vista libre mirando ese punto, para
  // revisar un sitio concreto (lo usan las herramientas de comprobación)
  const q = new URLSearchParams(location.search);
  const v3 = (k) => { const a = (q.get(k) || "").split(",").map(Number); return a.length === 3 && a.every(Number.isFinite) ? new THREE.Vector3(...a) : null; };
  const pc = v3("cam"), pm = v3("mira");
  if (q.get("vista") === "libre") modo(false);
  // en la miniatura de la app: la cámara gira despacio alrededor de la pista (si tocas, se para)
  if (q.has("incrustado")) {
    orbit.autoRotate = true;
    orbit.autoRotateSpeed = 0.7;
    orbit.addEventListener("start", () => { orbit.autoRotate = false; });
  }
  if (pc && pm) {
    modo(false);
    camera.position.copy(pc);
    orbit.target.copy(pm);
    orbit.update();
  }
}

$("archivo").addEventListener("change", (e) => {
  const f = e.target.files[0];
  if (f) cargar(URL.createObjectURL(f), f.name);
});

// ---------------------------------------------------------------- controles
function modo(manejar) {
  st.manejar = manejar;
  $("b-modo").setAttribute("aria-pressed", String(manejar));
  $("b-modo").textContent = manejar ? TX.conducir : TX.libre;
  $("b-cam").hidden = !manejar;
  orbit.enabled = !manejar;
  $("hud").hidden = !manejar;
  $("mandos").hidden = !manejar;
  if (!manejar) { orbit.target.copy(st.pos); }
}
$("b-modo").onclick = () => modo(!st.manejar);
$("b-cam").onclick = () => { st.camara = st.camara === "baja" ? "alta" : "baja"; };
$("b-reinicio").onclick = () => colocarEnSalida();
$("b-calidad").onclick = () => { alta = !alta; $("b-calidad").setAttribute("aria-pressed", String(alta)); ajustarCalidad(); };
const MAPA = { ArrowUp: "acel", KeyW: "acel", ArrowDown: "freno", KeyS: "freno", ArrowLeft: "izq", KeyA: "izq", ArrowRight: "der", KeyD: "der", Space: "freno" };
window.addEventListener("keydown", (e) => {
  if (MAPA[e.code]) { keys[MAPA[e.code]] = true; e.preventDefault(); }
  if (e.code === "KeyR") colocarEnSalida();
  if (e.code === "KeyV") modo(!st.manejar);
  if (e.code === "KeyC") $("b-cam").onclick();
});
window.addEventListener("keyup", (e) => { if (MAPA[e.code]) keys[MAPA[e.code]] = false; });
for (const el of document.querySelectorAll(".tecla")) {
  const k = el.dataset.k;
  const on = (e) => { e.preventDefault(); el.setPointerCapture?.(e.pointerId); keys[k] = true; el.classList.add("on"); };
  const off = () => { keys[k] = false; el.classList.remove("on"); };
  el.addEventListener("pointerdown", on);
  el.addEventListener("pointerup", off);
  el.addEventListener("pointercancel", off);
  el.addEventListener("lostpointercapture", off);
}

// ---------------------------------------------------------------- cámara por calle
const tmpF = new THREE.Vector3(), tmpR = new THREE.Vector3();
let dirGiro = 0;
function fisica(dt) {
  if (piloto.ruta) pilotoAutomatico();
  const acel = keys.acel ? 1 : 0, fren = keys.freno ? 1 : 0;
  const giro = piloto.ruta ? piloto.giro : (keys.izq ? 1 : 0) - (keys.der ? 1 : 0);
  dirGiro += (giro - dirGiro) * Math.min(1, dt * 6);
  const vmax = VMAX[st.superficie] ?? 30, agarre = AGARRE[st.superficie] ?? 0.8;
  if (acel) st.v += (st.v < 0 ? 12 : 6.5 * agarre) * dt;
  if (fren) st.v -= (st.v > 0.5 ? 11 * agarre : 4) * dt;
  st.v -= st.v * 0.12 * dt + Math.sign(st.v) * 0.4 * dt;
  if (st.v > vmax) st.v -= (st.v - vmax) * 2.5 * dt;
  st.v = Math.max(-8, st.v);
  if (!acel && !fren && Math.abs(st.v) < 0.25) st.v = 0;
  const delta = 0.55 * dirGiro / (1 + Math.abs(st.v) / 22);
  st.yaw += (st.v / 2.6) * Math.tan(delta) * dt;
  tmpF.set(Math.sin(st.yaw), 0, Math.cos(st.yaw));
  const paso = st.v * dt;
  // tramo en vivo: si delante aún no hay suelo (el pedazo no ha llegado), el coche espera
  if (VIVO && Math.abs(paso) > 0) {
    const s = Math.sign(paso);
    if (!alturaEn(st.pos.x + tmpF.x * (paso + 3 * s), st.pos.z + tmpF.z * (paso + 3 * s), st.pos.y, 3)) {
      vivo.espera = true; st.v = 0; return;            // justo delante no hay nada: alto
    }
    // más allá (lo que se recorre en ~1.5 s más la frenada): si falta, frenar a fondo desde ya
    const ade = s * (Math.abs(st.v) * 1.5 + st.v * st.v / 16 + 5);
    vivo.espera = !alturaEn(st.pos.x + tmpF.x * ade, st.pos.z + tmpF.z * ade, st.pos.y, 3 + Math.abs(ade) * 0.15);
    if (vivo.espera) st.v -= Math.sign(st.v) * Math.min(Math.abs(st.v), 9 * dt);
  }
  // choque con muros, defensas, vallas y edificios
  if (muros.length && Math.abs(paso) > 0) {
    const dir = tmpF.clone().multiplyScalar(Math.sign(paso));
    ray.set(st.pos.clone().add(new THREE.Vector3(0, 0.7, 0)), dir);
    ray.far = Math.abs(paso) + 2.2;
    if (ray.intersectObjects(muros, false)[0]) { st.v = -st.v * 0.25; return; }
  }
  st.pos.addScaledVector(tmpF, paso);
  // altura e inclinación con cuatro rayos (adelante, atrás, izquierda, derecha)
  tmpR.set(tmpF.z, 0, -tmpF.x);
  const c = alturaEn(st.pos.x, st.pos.z, st.pos.y, 3);
  if (c) {
    st.superficie = (c.object.name.match(/^\d([A-Z]+)/) || [])[1] || "GRASS";
    st.pos.y += (c.point.y - st.pos.y) * Math.min(1, dt * 18);
    const f = alturaEn(st.pos.x + tmpF.x * 1.4, st.pos.z + tmpF.z * 1.4, st.pos.y, 3);
    const b = alturaEn(st.pos.x - tmpF.x * 1.4, st.pos.z - tmpF.z * 1.4, st.pos.y, 3);
    const l = alturaEn(st.pos.x + tmpR.x * 0.8, st.pos.z + tmpR.z * 0.8, st.pos.y, 3);
    const r = alturaEn(st.pos.x - tmpR.x * 0.8, st.pos.z - tmpR.z * 0.8, st.pos.y, 3);
    if (f && b && l && r) {
      const vf = new THREE.Vector3().subVectors(f.point, b.point).normalize();
      const vl = new THREE.Vector3().subVectors(l.point, r.point).normalize();
      const up = new THREE.Vector3().crossVectors(vf, vl).normalize();
      if (up.y < 0) up.negate();
      st.up.lerp(up, Math.min(1, dt * 10)).normalize();
    }
  }
  // ruta y cronómetro
  if (st.ruta) {
    st.iRuta = indiceCercano(st.pos, st.iRuta - 40, st.iRuta + 40);
    const s = st.rutaS[st.iRuta];
    $("cad").textContent = cadenamiento(s);
    const cr = st.crono, ahora = performance.now() / 1000;
    if (cr.estado === "listo" && st.iRuta >= st.iIni && st.iRuta < st.iIni + 30) { cr.estado = "corriendo"; cr.t0 = ahora; }
    if (cr.estado === "corriendo") {
      cr.t = ahora - cr.t0;
      if (st.iRuta >= st.iFin && cr.t > 3) { cr.estado = "fin"; $("crono").classList.add("fin"); }
    }
    $("crono").textContent = cr.estado === "listo" ? TX.cruza : fmtTiempo(cr.t);
  }
  $("vel").textContent = Math.round(Math.abs(st.v) * 3.6);
  $("sup").textContent = SUPERFICIES[st.superficie] || st.superficie;
}

function camaraManejo(dt) {
  const fwd = new THREE.Vector3(Math.sin(st.yaw), 0, Math.cos(st.yaw))
    .projectOnPlane(st.up)
    .normalize();
  const altura = st.camara === "alta" ? 3.5 : 1.55;
  const deseo = st.pos.clone().add(new THREE.Vector3(0, altura, 0));
  const suelo2 = alturaEn(deseo.x, deseo.z, deseo.y);
  if (suelo2 && deseo.y < suelo2.point.y + 1.0) deseo.y = suelo2.point.y + 1.0;
  camera.position.lerp(deseo, Math.min(1, dt * 12));
  const mira = st.pos.clone()
    .add(new THREE.Vector3(0, altura * 0.9, 0))
    .addScaledVector(fwd, 22);
  camera.lookAt(mira);
  sol.position.copy(st.pos).add(new THREE.Vector3(120, 220, 80));
  sol.target.position.copy(st.pos);
}

// ---------------------------------------------------------------- ciclo
const reloj = new THREE.Clock();
function ciclo() {
  const dt = Math.min(0.05, reloj.getDelta());
  if (mundo) {
    if (st.manejar) { fisica(dt); camaraManejo(dt); }
    else orbit.update();
  }
  renderer.render(scene, camera);
  requestAnimationFrame(ciclo);
}
redimensionar();
ajustarCalidad();
ciclo();

// ---------------------------------------------------------------- tramo en vivo (?vivo=1)
// El servidor (python -m openlaps.vivo) genera la pista a pedazos de 256 m alrededor del coche. Aquí se
// le dice dónde está el coche y se cargan los pedazos listos cercanos (y se sueltan los lejanos). Todos
// comparten origen: cada .glb cae en su sitio sin moverlo.
const QS = new URLSearchParams(location.search);
const VIVO = QS.has("vivo");
const vivo = { id: "web-" + Math.random().toString(36).slice(2, 8), piezas: new Map(), cargando: new Set(), mats: new Map(), espera: false, estado: null, R_CARGA: 520, R_SOLTAR: 760 };
const piloto = { ruta: null, i: 0, giro: 0, vmax: (Number(QS.get("vmax")) || 50) / 3.6 };   // ?vmax en km/h

function distPedazo(i, j, x, z) {
  const L = vivo.estado.L, y = -z;              // local: x este, y norte (z del glb = -norte)
  const x0 = (i - 0.5) * L, x1 = (i + 0.5) * L, y0 = (j - 0.5) * L, y1 = (j + 0.5) * L;
  return Math.hypot(Math.max(x0 - x, 0, x - x1), Math.max(y0 - y, 0, y - y1));
}

function rehacerColisiones() {
  suelo = []; muros = [];
  for (const p of vivo.piezas.values()) { suelo.push(...p.suelo); muros.push(...p.muros); }
}

function cargarPedazo(i, j) {
  const k = `${i}_${j}`;
  vivo.cargando.add(k);
  loader.load(`vivo/p/p_${k}.glb`, (gltf) => {
    vivo.cargando.delete(k);
    const g = gltf.scene, p = { g, suelo: [], muros: [] };
    g.traverse((o) => {
      if (!o.isMesh) return;
      const n = o.name, m = o.material;
      o.receiveShadow = true;
      o.castShadow = /edificios|vegetacion|defensa|puente/.test(n);
      // los materiales de la biblioteca (asfalto, banqueta, fachadas…) se repiten en cada pedazo: uno solo
      if (!m.name.startsWith("tv_")) {
        const ya = vivo.mats.get(m.name);
        if (ya) { m.map?.dispose(); m.emissiveMap?.dispose(); m.dispose(); o.material = ya; }
        else { if (m.map) m.map.anisotropy = renderer.capabilities.getMaxAnisotropy(); vivo.mats.set(m.name, m); }
      } else if (m.map) m.map.anisotropy = renderer.capabilities.getMaxAnisotropy();
      if (/^\d(?!WALL)[A-Z]+_/.test(n)) { o.geometry.computeBoundsTree(); p.suelo.push(o); }
      else if (/^\dWALL/.test(n)) { o.geometry.computeBoundsTree(); p.muros.push(o); }
    });
    mundo.add(g);
    vivo.piezas.set(k, p);
    rehacerColisiones();
  }, undefined, () => { vivo.cargando.delete(k); });
}

function soltarPedazo(k) {
  const p = vivo.piezas.get(k);
  mundo.remove(p.g);
  p.g.traverse((o) => {
    if (!o.isMesh) return;
    o.geometry.dispose();
    if (o.material.name.startsWith("tv_")) { o.material.map?.dispose(); o.material.dispose(); }
  });
  vivo.piezas.delete(k);
  rehacerColisiones();
}

function alturaLibre(x, z) {
  ray.set(new THREE.Vector3(x, 9000, z), ABAJO);
  ray.far = 20000;
  return ray.intersectObjects(suelo, false)[0] || null;
}

async function pulsoVivo() {
  const v = st.manejar ? st.v : 0;
  const ref = st.spawn ? (st.manejar ? st.pos : orbit.target) : null;
  const q = (ref ? `?x=${ref.x.toFixed(1)}&z=${ref.z.toFixed(1)}&vx=${(Math.sin(st.yaw) * v).toFixed(2)}&vz=${(Math.cos(st.yaw) * v).toFixed(2)}&` : "?")
    + `c=${vivo.id}`;   // cada visor es un cliente: el servidor atiende a todos los coches a la vez
  let e;
  try { e = await (await fetch(`vivo/foco${q}`)).json(); }
  catch { $("info").textContent = TX.vivo_sin; $("info").hidden = false; return; }
  vivo.estado = e;
  const S = e.salida;
  const px = ref ? ref.x : (S ? S.x : 0), pz = ref ? ref.z : (S ? S.z : 0);
  // cargar los listos cercanos (de dos en dos, el más cercano primero) y soltar los lejanos
  const rCarga = vivo.R_CARGA + Math.abs(v) * 6;
  const ax = px + Math.sin(st.yaw) * v * 4, az = pz + Math.cos(st.yaw) * v * 4;   // dónde estará en ~4 s
  const urg = (i, j) => Math.min(distPedazo(i, j, px, pz), distPedazo(i, j, ax, az) * 0.8);
  const faltan = e.listos.filter(([i, j]) => !vivo.piezas.has(`${i}_${j}`) && !vivo.cargando.has(`${i}_${j}`)
    && urg(i, j) < rCarga).sort((a, b) => urg(a[0], a[1]) - urg(b[0], b[1]));
  for (const [i, j] of faltan.slice(0, Math.max(0, 3 - vivo.cargando.size))) cargarPedazo(i, j);
  for (const k of [...vivo.piezas.keys()]) {
    const [i, j] = k.split("_").map(Number);
    if (distPedazo(i, j, px, pz) > vivo.R_SOLTAR + Math.abs(v) * 6) soltarPedazo(k);
  }
  // la salida, en cuanto hay suelo debajo
  if (!st.spawn && S) {
    const h = alturaLibre(S.x, S.z);
    if (h) {
      st.spawn = { pos: new THREE.Vector3(S.x, h.point.y, S.z), fwd: new THREE.Vector3(S.fx, 0, S.fz).normalize() };
      $("vacio").hidden = true;
      colocarEnSalida();
      camera.position.copy(st.pos).add(new THREE.Vector3(-8, 4, -8));
      modo(true);
      if (QS.has("auto")) pedirRuta();
    }
  }
  $("info").textContent = `${TX.vivo_en_vivo} · ${vivo.piezas.size} ${TX.vivo_pedazos}` +
    (e.en_curso.length ? ` · ${TX.vivo_generando} ${e.en_curso.length}` : "") + (e.t_medio ? ` · ${e.t_medio} s` : "") +
    (vivo.espera ? ` · ${TX.vivo_espera}` : "") +
    (e.zona_lista != null && e.zona_lista < 0.97 ? ` · ${TX.vivo_zona} ${Math.round(e.zona_lista * 100)} %` : "");
  $("info").hidden = false;
}

// piloto automático (?auto=metros): sigue la ruta de prueba del servidor; sirve para probar sin manos. La ruta
// llega a trozos: el servidor da lo que ya tiene bajado de OSM y se vuelve a pedir hasta tenerla entera.
async function pedirRuta() {
  const quiero = Number(QS.get("auto")) || 3000;
  try {
    const r = await (await fetch(`vivo/ruta?metros=${quiero}&espera=2`)).json();
    if (!piloto.ruta || r.puntos.length > piloto.ruta.length) piloto.ruta = r.puntos;
  } catch { /* se reintenta */ }
  if (!piloto.ruta || piloto.ruta.length * 2 < quiero - 20) setTimeout(pedirRuta, 4000);
}

function pilotoAutomatico() {
  const R = piloto.ruta;
  let best = piloto.i, bd = Infinity;
  for (let i = piloto.i; i < Math.min(R.length, piloto.i + 60); i++) {
    const d = Math.hypot(R[i][0] - st.pos.x, R[i][1] - st.pos.z);
    if (d < bd) { bd = d; best = i; }
  }
  piloto.i = best;
  // al final de la ruta: frenar hasta parar (sin pasar a reversa, que es lo que hace el freno a 0 km/h)
  if (best >= R.length - 3) { keys.acel = false; keys.freno = st.v > 0.3; piloto.giro = 0; return; }
  const ade = Math.round((7 + Math.abs(st.v) * 0.75) / 2);      // puntos cada 2 m: mira más lejos cuanto más rápido
  const t = R[Math.min(R.length - 1, best + ade)];
  const err = ((Math.atan2(t[0] - st.pos.x, t[1] - st.pos.z) - st.yaw + 3 * Math.PI) % (2 * Math.PI)) - Math.PI;
  piloto.giro = Math.max(-1, Math.min(1, err * (st.v > 20 ? 1.5 : 2.2)));
  // velocidad: la máxima con la que se toma cada curva de lo que viene (curvatura en tramos de 16 m, aceleración
  // lateral de 3.5 m/s²), contando lo que hace falta para frenar hasta ella (5 m/s²)
  const rumbo = (k) => { const p = R[Math.min(R.length - 1, k)], q = R[Math.min(R.length - 1, k + 8)]; return Math.atan2(q[0] - p[0], q[1] - p[1]); };
  let vObj = piloto.vmax;
  const alcance = Math.min(R.length - best - 1, Math.ceil((st.v * st.v / 10 + 40) / 2));
  for (let k = 0; k < alcance; k += 4) {
    const dA = Math.abs(((rumbo(best + k + 8) - rumbo(best + k) + 3 * Math.PI) % (2 * Math.PI)) - Math.PI);
    const vCurva = Math.sqrt(3.5 * 16 / Math.max(dA, 1e-3));
    vObj = Math.min(vObj, Math.sqrt(vCurva * vCurva + 2 * 5 * k * 2));
  }
  vObj = Math.max(5, vObj);
  if (best >= R.length - 25) vObj = 3;      // fin del trozo de ruta que hay: despacio hasta que llegue más
  keys.acel = st.v < vObj - 0.5;
  keys.freno = st.v > vObj + 2 && st.v > 0.3;
}

function iniciarVivo() {
  mundo = new THREE.Group();
  scene.add(mundo);
  scene.fog.near = 180; scene.fog.far = vivo.R_CARGA;
  $("nombre").textContent = TX.vivo_titulo;
  $("v-titulo").textContent = TX.vivo_titulo;
  $("v-texto").textContent = TX.vivo_gen;
  $("barra").parentElement.hidden = true;
  $("archivo").parentElement.hidden = true;
  $("b-reinicio").onclick = () => { if (st.spawn) colocarEnSalida(); };
  window.openlapsVivo = { st, camera, orbit, vivo, piloto, modo, scene };   // para las pruebas automáticas
  pulsoVivo();
  setInterval(pulsoVivo, 500);
}

// ---------------------------------------------------------------- arranque
// La escena puede venir como .glb o, donde solo se sirven archivos de texto, como partes
// base64 (escena.parte1.txt, escena.parte2.txt, …) que se reconstruyen aquí.
async function cargarPartes() {
  const trozos = [];
  for (let i = 1; i < 20; i++) {
    const r = await fetch(`escena.parte${i}.txt`);
    if (!r.ok) break;
    trozos.push(await r.text());
    $("barra").style.width = `${Math.min(90, i * 30)}%`;
  }
  if (!trozos.length) throw new Error("sin escena");
  const bin = atob(trozos.join("").replace(/\s+/g, ""));
  const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  loader.parse(buf.buffer, "", (gltf) => { try { montar(gltf); } catch (e) { fallo(e); } }, fallo);
}

const param = new URLSearchParams(location.search).get("glb");
const porDefecto = param || "escena.glb";
if (VIVO) iniciarVivo();
else fetch(porDefecto, { method: "HEAD" }).then((r) => {
  if (r.ok) cargar(porDefecto);
  else return cargarPartes();
}).catch(() => cargarPartes()).catch(() => {
  $("v-titulo").textContent = TX.abre_una;
  $("barra").parentElement.hidden = true;
  $("v-texto").textContent = TX.genera;
});
</script>
